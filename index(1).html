function totals(){let income=0,expected=0,paidCount=0,totalEntries=0;const weeks=Math.max(1,...data.students.map(s=>s.payments.length));data.students.forEach(s=>{for(let i=0;i<weeks;i++){const p=s.payments[i];expected+=data.settings.weeklyDue;if(p?.paid){income+=Number(p.amount)||0;paidCount++}totalEntries++}});const expenses=data.expenses.reduce((a,e)=>a+(Number(e.amount)||0),0);return {income,expenses,balance:income-expenses,expected,paidCount,totalEntries,weeks,studentCount:data.students.length,expenseShare:data.students.length?expenses/data.students.length:0}}

inggu baru untuk melanjutkan pencatatan jangka panjang, atau batalkan pembayaran secara massal.</p></div></div><div class="formactions" style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" data-action="addweek">＋ Tambah minggu berikutnya</button><button class="btn danger" data-action="cancelweek" data-week="${selectedWeek}">Batalkan semua di Minggu ${selectedWeek}</button><button class="btn danger" data-action="cancelallpayments">Batalkan semua pembayaran</button></div><p class="footnote">Pembatalan massal memerlukan konfirmasi. “Minggu ini” hanya mengubah periode yang dipilih; “semua pembayaran” mengubah seluruh minggu yang tercatat.</p>`:''}</section><section class="card"><div class="cardhead"><div><h2 class="h3">Ringkasan perhitungan</h2><p>Dua cara baca angka kas, agar tidak rancu.</p></div><span class="pill">Transparan</span></div><div class="notice-row"><div class="miniicon">1</div><div><strong style="font-size:12px">Saldo kas bersama</strong><p class="small muted">${money(t.income)} − ${money(t.expenses)} = <strong>${money(t.balance)}</strong></p></div></div><div class="hr"></div><div class="notice-row"><div class="miniicon">2</div><div><strong style="font-size:12px">Perkiraan hasil bersih per siswa</strong><p class="small muted">Uang pribadi yang sudah dibayar dikurangi alokasi rata-rata pengeluaran kelas (${money(t.expenseShare)} per siswa). Hasil bisa berbeda per siswa jika jumlah pembayarannya berbeda.</p></div></div><div class="divider"></div><div class="formgrid"><div><div class="small muted">Total target iuran periode ini</div><strong>${money(t.expected)}</strong></div><div><div class="small muted">Pembayaran masuk</div><strong>${t.paidCount} / ${t.totalEntries} transaksi</strong></div><div><div class="small muted">Iuran mingguan</div><strong>${money(data.settings.weeklyDue)}</strong></div><div><div class="small muted">Jumlah anggota</div><strong>${t.studentCount} siswa</strong></div></div></section></div><section class="card"><div class="cardhead"><div><h2 class="h3">Total perolehan & hasil akhir per anak</h2><p>Data ini bisa dilihat seluruh anggota; data pribadi detail tersedia di login siswa masing-masing.</p></div><button class="btn ghost smallbtn" data-action="exportcash">Ekspor CSV ↓</button></div><div class="tablewrap"><table><thead><tr><th>Nama lengkap</th><th>Minggu dibayar</th><th>Total perolehan per anak</th><th>Alokasi pengeluaran</th><th>Hasil akhir simulasi</th><th>Belum dibayar</th></tr></thead><tbody>${data.students.map(s=>{const p=studentTotals(s);return `<tr><td><strong>${esc(s.name)}</strong><div class="small muted">${esc(s.nickname||'')}</div></td><td>${p.entries} / ${p.weeks}</td><td class="nowrap">${money(p.paid)}</td><td class="nowrap">${money(p.share)}</td><td class="nowrap" style="font-weight:850;color:${p.net<0?'var(--red)':'var(--green)'}">${money(p.net)}</td><td class="nowrap">${money(p.outstanding)}</td></tr>`}).join('')}<tr class="totalline"><td>TOTAL / RATA-RATA</td><td>${t.paidCount} transaksi</td><td>${money(t.income)}</td><td>${money(t.expenses)}</td><td>${money(t.balance)} saldo bersama</td><td>${money(Math.max(0,t.expected-t.income))}</td></tr></tbody></table></div><p class="footnote" style="margin-top:12px">Pembulatan: alokasi ditampilkan sampai dua angka desimal supaya jumlah matematis tetap transparan. Ini merupakan laporan iuran kelas, bukan rekening bank atau saldo kepemilikan individual.</p></section>${can?`<div class="grid two" style="margin-top:16px"><section class="card"><div class="cardhead"><div><h2 class="h3">Catat pengeluaran</h2><p>Tambah transaksi dengan nominal dan tanggal.</p></div><span class="pill purple">${isAdmin()?'Admin':'Bendahara'}</span></div><form id="expenseForm"><div class="formgrid"><div class="field"><label>Nama pengeluaran</label><input name="title" required placeholder="Contoh: cetak banner"></div><div class="field"><label>Nominal (Rp)</label><input name="amount" type="number" min="1" step="1" required></div><div class="field"><label>Tanggal</label><input name="date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Catatan</label><input name="note" placeholder="Opsional"></div></div><div class="formactions"><button class="btn" type="submit">Simpan pengeluaran</button></div></form></section><section class="card"><div class="cardhead"><div><h2 class="h3">Riwayat pengeluaran</h2><p>Semua pengeluaran dihitung ke laporan.</p></div></div>${data.expenses.length?`<div class="tablewrap"><table style="min-width:450px"><thead><tr><th>Tanggal</th><th>Transaksi</th><th>Nominal</th><th></th></tr></thead><tbody>${data.expenses.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<tr><td>${fmtDate(e.date)}</td><td><strong>${esc(e.title)}</strong><div class="small muted">${esc(e.note||'')}</div></td><td class="nowrap">${money(e.amount)}</td><td><button class="btn danger smallbtn" data-action="deleteexpense" data-id="${e.id}">Hapus</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada pengeluaran.</div>'}</section></div>`:''}`}
function paymentTable(s,edit){return `<div class="tablewrap"><table style="min-width:500px"><thead><tr><th>Minggu</th><th>Nominal iuran</th><th>Status</th><th>Tanggal catatan</th>${edit?'<th>Aksi</th>':''}</tr></thead><tbody>${s.payments.map(p=>`<tr><td>Minggu ${p.week}</td><td>${money(p.amount||0)}</td><td>${p.paid?'<span class="pill green">Lunas</span>':'<span class="pill amber">Belum dibayar</span>'}</td><td>${p.paid?fmtDate(p.paidAt):'—'}</td>${edit?`<td><button class="btn ${p.paid?'danger':'secondary'} smallbtn" data-action="togglepayment" data-student="${s.id}" data-week="${p.week}">${p.paid?'Tandai belum':'Tandai lunas'}</button></td>`:''}</tr>`).join('')}</tbody></table></div>`}
function paymentWeekTable(week,can){return `<div class="tablewrap"><table style="min-width:500px"><thead><tr><th>Nama siswa</th><th>Nominal</th><th>Status</th>${can?'<th>Perbarui</th>':''}</tr></thead><tbody>${data.students.map(s=>{let p=s.payments.find(p=>p.week===week);if(!p){p={week,amount:0,paid:false,paidAt:''};}return `<tr><td><strong>${esc(s.name)}</strong></td><td>${money(p.paid?p.amount:0)}</td><td>${p.paid?'<span class="pill green">Lunas</span>':'<span class="pill amber">Belum bayar</span>'}</td>${can?`<td><button class="btn ${p.paid?'danger':'secondary'} smallbtn" data-action="togglepayment" data-student="${s.id}" data-week="${week}">${p.paid?'Batalkan':'Catat Rp5.000'}</button></td>`:''}</tr>`}).join('')}</tbody></table></div>`}
function scheduleView(){let today=DAYS[(new Date().getDay()+6)%7]||'Senin';const can=isAdmin();return `<div class="sectionhead"><div><div class="eyebrow">Ritme belajar & kerja sama</div><h2 class="h2">Jadwal Pelajaran & Piket</h2><p class="p">Jadwal harian, guru mata pelajaran, dan kelompok piket kelas.</p></div>${editBadge(can)}</div><div class="grid two"><section class="card"><div class="cardhead"><div><h2 class="h3">Jadwal pelajaran</h2><p>Gunakan hari di bawah untuk menyaring jadwal.</p></div></div><div class="weekstrip" style="margin-bottom:15px">${DAYS.map(d=>`<button class="weekchip ${d===today?'active':''}" data-action="dayfilter" data-day="${d}"><strong>${d.slice(0,3)}</strong><span>${data.schedule.filter(s=>s.day===d).length} mapel</span></button>`).join('')}</div><div id="scheduleTable">${scheduleTable(today,can)}</div></section><section class="card"><div class="cardhead"><div><h2 class="h3">Kelompok piket kebersihan</h2><p>Data pembagian kelompok untuk satu pekan.</p></div></div>${data.chores.map(c=>`<div style="padding:12px 0;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start"><div class="dateblock" style="height:45px;width:48px"><strong style="font-size:13px">${esc(c.day.slice(0,3))}</strong><span>piket</span></div><div style="flex:1"><strong style="font-size:12px">${esc(c.group)}</strong><div class="small muted" style="margin-top:4px">${esc(c.members)}</div></div>${can?`<button class="btn danger smallbtn" data-action="deletechore" data-id="${c.id}">Hapus</button>`:''}</div>`).join('')||'<div class="empty">Belum ada pembagian piket.</div>'}</section></div>${can?`<div class="grid two" style="margin-top:16px"><section class="card"><div class="cardhead"><div><h2 class="h3">Tambah jadwal pelajaran</h2><p>Perubahan jadwal hanya dapat dilakukan admin.</p></div></div><form id="scheduleForm"><div class="formgrid"><div class="field"><label>Hari</label><select name="day">${DAYS.map(d=>`<option>${d}</option>`).join('')}</select></div><div class="field"><label>Jam pelajaran</label><input name="time" required placeholder="08.20–09.00"></div><div class="field"><label>Mata pelajaran</label><input name="subject" required placeholder="Nama mata pelajaran"></div><div class="field"><label>Nama guru</label><input name="teacher" required placeholder="Nama guru"></div><div class="field"><label>Jam ke-</label><input name="period" type="number" min="1" value="1" required></div></div><div class="formactions"><button class="btn">Tambah jadwal</button></div></form></section><section class="card"><div class="cardhead"><div><h2 class="h3">Tambah kelompok piket</h2><p>Atur nama kelompok, hari, dan anggota piket.</p></div></div><form id="choreForm"><div class="formgrid"><div class="field"><label>Nama kelompok</label><input name="group" required placeholder="Kelompok 6"></div><div class="field"><label>Hari</label><select name="day">${DAYS.map(d=>`<option>${d}</option>`).join('')}</select></div><div class="field fullrow"><label>Nama anggota</label><textarea name="members" required placeholder="Pisahkan nama dengan koma"></textarea></div></div><div class="formactions"><button class="btn">Tambah kelompok</button></div></form></section></div>`:'<p class="footnote" style="margin-top:14px">Jika jadwal berubah, hubungi admin kelas. Perubahan resmi akan ditampilkan setelah admin memperbarui portal.</p>'}`}
function scheduleTable(day,can){let rows=data.schedule.filter(s=>s.day===day).sort((a,b)=>a.period-b.period);return rows.length?`<div class="tablewrap"><table style="min-width:420px"><thead><tr><th>Jam</th><th>Mapel & Guru</th><th>Ke-</th>${can?'<th></th>':''}</tr></thead><tbody>${rows.map(s=>`<tr><td class="nowrap">${esc(s.time)}</td><td><strong>${esc(s.subject)}</strong><div class="small muted">${esc(s.teacher)}</div></td><td>${s.period}</td>${can?`<td><button class="btn danger smallbtn" data-action="deleteschedule" data-id="${s.id}">×</button></td>`:''}</tr>`).join('')}</tbody></table></div>`:'<div class="empty">Belum ada jadwal untuk hari '+esc(day)+'.</div>'}
function calendarView(){const can=isAdmin(),today=new Date().toISOString().slice(0,10);return `<div class="sectionhead"><div><div class="eyebrow">Catat tanggal penting</div><h2 class="h2">Kalender Akademik Kelas</h2><p class="p">UTS/UAS, tenggat tugas, study tour, acara kelas, dan pengingat lainnya.</p></div>${editBadge(can)}</div><section class="card"><div class="cardhead"><div><h2 class="h3">Agenda kelas</h2><p>Agenda selesai tetap ada sebagai arsip, tidak otomatis dihapus.</p></div><span class="pill">${data.events.length} agenda</span></div>${data.events.slice().sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="announcement"><div class="dateblock"><strong>${new Date(e.date+'T12:00:00').getDate()}</strong><span>${new Date(e.date+'T12:00:00').toLocaleDateString('id-ID',{month:'short'})}</span></div><div class="anncontent"><h3>${esc(e.title)}</h3><p>${esc(e.note||'Belum ada catatan.')}</p><div class="annmeta"><span>${fmtDate(e.date,{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</span><span class="pill">${esc(e.type)}</span>${e.date<today?'<span class="pill green">Selesai · arsip</span>':'<span class="pill purple">Akan datang</span>'}</div></div>${can?`<button class="btn danger smallbtn" data-action="deleteevent" data-id="${e.id}">Hapus</button>`:''}</div>`).join('')||'<div class="empty">Belum ada agenda akademik.</div>'}</section>${can?`<section class="card" style="margin-top:16px"><div class="cardhead"><div><h2 class="h3">Tambah pengingat</h2><p>Admin dapat menambahkan agenda baru.</p></div></div><form id="eventForm"><div class="formgrid"><div class="field"><label>Judul kegiatan</label><input name="title" required placeholder="Contoh: UAS semester ganjil"></div><div class="field"><label>Tanggal</label><input name="date" type="date" required></div><div class="field"><label>Kategori</label><select name="type"><option>Ujian</option><option>Tenggat tugas</option><option>Study tour</option><option>Acara kelas</option><option>Libur</option><option>Lainnya</option></select></div><div class="field"><label>Catatan</label><input name="note" placeholder="Tempat, perlengkapan, dll."></div></div><div class="formactions"><button class="btn">Simpan agenda</button></div></form></section>`:''}`}
function announcementsView(){const can=isAdmin();return `<div class="sectionhead"><div><div class="eyebrow">Informasi resmi kelas</div><h2 class="h2">Papan Pengumuman Digital</h2><p class="p">Tanggal dan jam terbit dicatat otomatis; pengumuman selesai tetap menjadi arsip.</p></div>${editBadge(can)}</div><section class="card"><div class="cardhead"><div><h2 class="h3">Semua pengumuman</h2><p>Informasi terbaru ditampilkan lebih dahulu.</p></div><span class="pill">${data.announcements.length} catatan</span></div>${data.announcements.slice().sort((a,b)=>Number(b.pinned)-Number(a.pinned)||b.createdAt.localeCompare(a.createdAt)).map(a=>`<article class="announcement"><div class="dateblock"><strong>${new Date(a.createdAt).getDate()}</strong><span>${new Date(a.createdAt).toLocaleDateString('id-ID',{month:'short'})}</span></div><div class="anncontent"><h3>${a.pinned?'★ ':''}${esc(a.title)}</h3><p>${esc(a.body)}</p><div class="annmeta"><span>Diposting ${fmtDateTime(a.createdAt)}</span><span>oleh ${esc(a.author||'Admin')}</span>${a.done?'<span class="pill green">Selesai · arsip</span>':'<span class="pill purple">Aktif</span>'}</div></div>${can?`<div style="display:grid;gap:6px;align-content:start"><button class="btn ghost smallbtn" data-action="toggleann" data-id="${a.id}">${a.done?'Aktifkan':'Tandai selesai'}</button><button class="btn ${a.pinned?'danger':'secondary'} smallbtn" data-action="pinann" data-id="${a.id}">${a.pinned?'Lepas pin':'Pin'}</button></div>`:''}</article>`).join('')||'<div class="empty">Belum ada pengumuman.</div>'}</section>${can?`<section class="card" style="margin-top:16px"><div class="cardhead"><div><h2 class="h3">Terbitkan pengumuman</h2><p>Waktu terbit mengikuti waktu perangkat saat disimpan.</p></div></div><form id="announcementForm"><div class="formgrid"><div class="field fullrow"><label>Judul pengumuman</label><input name="title" required maxlength="120" placeholder="Contoh: Pengumpulan uang kas minggu ini"></div><div class="field fullrow"><label>Isi pengumuman</label><textarea name="body" required placeholder="Tulis informasi lengkap, termasuk tanggal, jam, dan tempat bila diperlukan."></textarea></div><div class="field"><label>Nama penanggung jawab</label><input name="author" value="${esc(currentUser.name)}" required></div><div class="field" style="align-content:center"><label><input type="checkbox" name="pinned" style="width:auto;margin-right:7px">Sematkan di bagian atas</label></div></div><div class="formactions"><button class="btn">Terbitkan pengumuman</button></div></form></section>`:''}`}
function membersView(){const can=isAdmin();return `<div class="sectionhead"><div><div class="eyebrow">Teman seperjuangan</div><h2 class="h2">Direktori Anggota Kelas</h2><p class="p">Kenali anggota REPUBLIC OF X DKV dan kutipan andalan mereka.</p></div>${editBadge(can)}</div>${can?`<section class="card" style="margin-bottom:16px"><div class="cardhead"><div><h2 class="h3">Tambah anggota baru</h2><p>Daftarkan siswa baru ke direktori dan login siswa. PIN awal demo bisa diganti di pengaturan akun pada versi backend.</p></div><span class="pill purple">${data.students.length} anggota</span></div><form id="addMemberForm"><div class="formgrid"><div class="field"><label>Nama lengkap *</label><input name="name" required maxlength="100" placeholder="Nama lengkap siswa"></div><div class="field"><label>Nama panggilan</label><input name="nickname" maxlength="60" placeholder="Nama panggilan"></div><div class="field"><label>PIN login awal *</label><input name="pin" type="password" inputmode="numeric" pattern="[0-9]{4,8}" minlength="4" maxlength="8" required placeholder="4–8 digit"></div><div class="field"><label>Tanggal lahir</label><input name="birthdate" type="date"></div><div class="field"><label>Media sosial (opsional)</label><input name="social" maxlength="150" placeholder="@username atau tautan profil"></div><div class="field"><label>URL foto profil (opsional)</label><input name="photo" type="url" placeholder="https://..."></div><div class="field fullrow"><label>Quotes andalan</label><input name="quote" maxlength="150" placeholder="Kalimat favorit"></div></div><div class="formactions"><button class="btn">＋ Tambahkan anggota</button></div></form><p class="footnote">Anggota baru otomatis masuk ke daftar login siswa. Di prototipe, PIN hanya untuk demonstrasi dan disimpan lokal; jangan gunakan PIN pribadi asli sebelum backend aman tersedia.</p></section><section class="card" style="margin-bottom:16px"><div class="cardhead"><div><h2 class="h3">Perbarui profil anggota</h2><p>Admin dapat mengisi nama panggilan, tanggal lahir, media sosial, foto, dan kutipan.</p></div></div><form id="memberForm"><div class="formgrid"><div class="field"><label>Anggota</label><select name="id">${data.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select></div><div class="field"><label>Nama lengkap</label><input name="name" placeholder="Nama lengkap"></div><div class="field"><label>Nama panggilan</label><input name="nickname" placeholder="Nama panggilan"></div><div class="field"><label>Tanggal lahir</label><input name="birthdate" type="date"></div><div class="field"><label>Media sosial (opsional)</label><input name="social" placeholder="@username atau tautan profil"></div><div class="field"><label>URL foto profil (opsional)</label><input name="photo" type="url" placeholder="https://..."></div><div class="field fullrow"><label>Quotes andalan</label><input name="quote" maxlength="150" placeholder="Kalimat favorit"></div></div><div class="formactions"><button class="btn">Simpan profil</button></div></form><p class="footnote">Demi privasi, jangan masukkan nomor telepon, alamat rumah, atau data pribadi sensitif. Profil ini hanya contoh sampai ada backend dengan kontrol akses.</p></section>`:''}<div class="peoplegrid">${data.students.map(s=>`<article class="person">${s.photo?`<img src="${esc(s.photo)}" alt="Foto ${esc(s.name)}" style="width:56px;height:56px;border-radius:50%;object-fit:cover;margin-bottom:10px" onerror="this.style.display='none'">`:`<div class="avatar">${esc(initials(s.nickname||s.name))}</div>`}<h3>${esc(s.name)}</h3><div class="nick">${esc(s.nickname||'Nama panggilan belum diisi')}</div><div class="quote">“${esc(s.quote||'Belum ada quote.') }”</div>${s.birthdate?`<div class="small muted">🎂 ${fmtDate(s.birthdate,{day:'numeric',month:'long'})}</div>`:''}${s.social?`<div class="social">${esc(s.social)}</div>`:''}</article>`).join('')}</div>`}
function galleryView(){const can=isAdmin();return `<div class="sectionhead"><div><div class="eyebrow">Memori yang tersimpan</div><h2 class="h2">Galeri Foto & Video</h2><p class="p">Dokumentasi class meeting, kegiatan kelas, karya, dan momen berharga.</p></div>${editBadge(can)}</div>${can?`<section class="card" style="margin-bottom:16px"><div class="cardhead"><div><h2 class="h3">Tambah dokumentasi</h2><p>Gunakan URL media yang boleh dibagikan. Hindari unggah dokumentasi pribadi tanpa izin.</p></div></div><form id="galleryForm"><div class="formgrid"><div class="field"><label>Judul</label><input name="title" required></div><div class="field"><label>Jenis</label><select name="type"><option value="photo">Foto</option><option value="video">Video</option></select></div><div class="field fullrow"><label>URL foto/video</label><input name="url" type="url" placeholder="https://..."></div><div class="field fullrow"><label>Keterangan</label><textarea name="caption" placeholder="Kenangan atau cerita di balik dokumentasi"></textarea></div></div><div class="formactions"><button class="btn">Tambah ke galeri</button></div></form></section>`:''}<div class="grid three">${data.gallery.map(g=>`<article class="media-card"><div class="media-cover">${g.url&&g.type==='photo'?`<img src="${esc(g.url)}" alt="${esc(g.title)}" loading="lazy" onerror="this.style.display='none'">`:g.type==='video'?'▶':'▧'}</div><div class="media-body"><div style="display:flex;justify-content:space-between;gap:7px"><h3>${esc(g.title)}</h3><span class="pill">${g.type==='video'?'Video':'Foto'}</span></div><p>${esc(g.caption||'')}</p><div class="annmeta"><span>${fmtDate(g.date)}</span>${g.url?`<a href="${esc(g.url)}" target="_blank" rel="noopener noreferrer" style="color:var(--accent)">Buka media ↗</a>`:''}</div>${can?`<button class="btn danger smallbtn" style="margin-top:9px" data-action="deletegallery" data-id="${g.id}">Hapus</button>`:''}</div></article>`).join('')}</div>`}
function creativeView(){const can=isAdmin();return `<div class="sectionhead"><div><div class="eyebrow">Karya & pencapaian</div><h2 class="h2">Pojok Kreativitas</h2><p class="p">Mading digital untuk karya desain, puisi, artikel, dan prestasi anggota kelas.</p></div>${editBadge(can)}</div>${can?`<section class="card" style="margin-bottom:16px"><div class="cardhead"><div><h2 class="h3">Publikasikan karya</h2><p>Admin mengelola mading digital kelas.</p></div></div><form id="creativeForm"><div class="formgrid"><div class="field"><label>Judul karya</label><input name="title" required></div><div class="field"><label>Kategori</label><select name="kind"><option>Karya desain</option><option>Puisi</option><option>Artikel</option><option>Prestasi akademik</option><option>Prestasi non-akademik</option><option>Lainnya</option></select></div><div class="field"><label>Nama pembuat</label><input name="author" required placeholder="Nama / nama panggilan"></div><div class="field fullrow"><label>Deskripsi / isi karya</label><textarea name="body" required placeholder="Tuliskan karya atau deskripsi singkatnya"></textarea></div></div><div class="formactions"><button class="btn">Terbitkan karya</button></div></form></section>`:''}<div class="grid three">${data.creations.map(c=>`<article class="card"><div class="iconbox" style="margin-bottom:14px">✦</div><span class="pill purple">${esc(c.kind)}</span><h3 style="font-size:16px;margin:10px 0 6px">${esc(c.title)}</h3><div class="small muted" style="margin-bottom:12px">Oleh ${esc(c.author)} · ${fmtDate(c.createdAt)}</div><p class="muted" style="font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere">${esc(c.body)}</p>${can?`<button class="btn danger smallbtn" style="margin-top:14px" data-action="deletecreative" data-id="${c.id}">Hapus karya</button>`:''}</article>`).join('')||'<div class="empty">Belum ada karya yang dipublikasikan.</div>'}</div>`}
function pollsView(){const can=isAdmin();return `<div class="sectionhead"><div><div class="eyebrow">Suara warga kelas</div><h2 class="h2">Sistem Voting / Polling</h2><p class="p">Ambil keputusan bersama secara demokratis. Satu akun demo hanya dapat memilih sekali per polling.</p></div>${editBadge(can)}</div>${can?`<section class="card" style="margin-bottom:16px"><div class="cardhead"><div><h2 class="h3">Buat polling baru</h2><p>Masukkan opsi dipisahkan dengan koma.</p></div></div><form id="pollForm"><div class="formgrid"><div class="field"><label>Pertanyaan polling</label><input name="title" required placeholder="Contoh: Pilih tempat study tour"></div><div class="field"><label>Opsi pilihan</label><input name="options" required placeholder="Pilihan A, Pilihan B, Pilihan C"></div></div><div class="formactions"><button class="btn">Buat polling</button></div></form></section>`:''}<div class="grid two">${data.polls.map(p=>{const total=p.options.reduce((n,o)=>n+o.votes,0),voted=p.voters.includes(currentUser.role==='student'?currentUser.studentId:currentUser.username);return `<section class="card"><div class="cardhead"><div><span class="pill ${p.open?'green':'amber'}">${p.open?'Voting dibuka':'Voting ditutup'}</span><h2 style="font-size:17px;margin:9px 0 0">${esc(p.title)}</h2><p>${total} suara masuk</p></div>${can?`<button class="btn ghost smallbtn" data-action="togglepoll" data-id="${p.id}">${p.open?'Tutup':'Buka'}</button>`:''}</div>${p.open&&!voted?`<form data-form="vote" data-id="${p.id}">${p.options.map((o,i)=>`<label class="option"><input type="radio" name="choice" value="${i}" required><span>${esc(o.name)}</span></label>`).join('')}<button class="btn full" style="margin-top:12px" type="submit">Kirim suara</button></form>`:p.open&&voted?'<div class="notice">Pilihanmu sudah tercatat. Hasil polling dapat dilihat di bawah.</div>':''}<div style="margin-top:15px">${p.options.map(o=>`<div style="margin:12px 0"><div style="display:flex;justify-content:space-between;gap:10px;font-size:11px"><span>${esc(o.name)}</span><strong>${o.votes} · ${total?Math.round(o.votes/total*100):0}%</strong></div><div class="pollbar"><span style="width:${total?o.votes/total*100:0}%"></span></div></div>`).join('')}</div>${can?`<button class="btn danger smallbtn" data-action="deletepoll" data-id="${p.id}">Hapus polling</button>`:''}</section>`}).join('')||'<div class="empty">Belum ada polling.</div>'}</div>`}
function countdownView(){const can=isAdmin(),target=new Date(data.countdown.date),diff=Math.max(0,target.getTime()-Date.now()),days=Math.floor(diff/86400000),hours=Math.floor(diff%86400000/3600000),mins=Math.floor(diff%3600000/60000),secs=Math.floor(diff%60000/1000);return `<div class="sectionhead"><div><div class="eyebrow">Menuju momen berikutnya</div><h2 class="h2">Countdown Kelas</h2><p class="p">Hitung mundur menuju kelulusan, libur semester, atau acara besar kelas.</p></div>${editBadge(can)}</div><section class="card" style="max-width:850px;margin:0 auto;text-align:center;padding:clamp(24px,5vw,50px)"><div class="iconbox" style="margin:0 auto 18px;font-size:23px;width:52px;height:52px">◷</div><div class="eyebrow">THE NEXT BIG MOMENT</div><h1 class="h1" style="font-size:clamp(28px,5vw,45px)">${esc(data.countdown.title)}</h1><p class="p">${fmtDateTime(data.countdown.date)}</p><div class="countdown"><div class="count-unit"><strong id="countDays">${days}</strong><span>Hari</span></div><div class="count-unit"><strong id="countHours">${String(hours).padStart(2,'0')}</strong><span>Jam</span></div><div class="count-unit"><strong id="countMins">${String(mins).padStart(2,'0')}</strong><span>Menit</span></div><div class="count-unit"><strong id="countSecs">${String(secs).padStart(2,'0')}</strong><span>Detik</span></div></div><p class="p">${esc(data.countdown.note||'Hitung mundur berjalan menuju tanggal yang ditetapkan.')}</p></section>${can?`<section class="card" style="max-width:850px;margin:16px auto 0"><div class="cardhead"><div><h2 class="h3">Ubah countdown</h2><p>Admin dapat mengubah judul dan tanggal target.</p></div></div><form id="countdownForm"><div class="formgrid"><div class="field"><label>Judul countdown</label><input name="title" required value="${esc(data.countdown.title)}"></div><div class="field"><label>Tanggal & waktu target</label><input name="date" type="datetime-local" required value="${esc(data.countdown.date)}"></div><div class="field fullrow"><label>Catatan</label><input name="note" value="${esc(data.countdown.note||'')}"></div></div><div class="formactions"><button class="btn">Simpan countdown</button></div></form></section>`:''}`}
function playlistView(){const can=isAdmin();let url=data.spotifyUrl||'',embed='';if(url){let m=url.match(/open\.spotify\.com\/(?:embed\/)?(playlist|album|track)\/([a-zA-Z0-9]+)/);if(m)embed=`https://open.spotify.com/embed/${m[1]}/${m[2]}?utm_source=generator&theme=0`;}
return `<div class="sectionhead"><div><div class="eyebrow">Soundtrack satu kelas</div><h2 class="h2">Spotify Playlist Kelas</h2><p class="p">Kumpulan lagu favorit untuk jam kosong, istirahat, atau perjalanan kelas.</p></div>${editBadge(can)}</div><section class="card" style="max-width:900px;margin:auto"><div class="cardhead"><div><h2 class="h3">Our class soundtrack ♫</h2><p>Putar musik secara legal melalui pemutar resmi Spotify.</p></div><span class="pill">Spotify</span></div>${embed?`<iframe title="Spotify Playlist Kelas" src="${esc(embed)}" width="100%" height="352" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy" style="border-radius:13px;background:#eee"></iframe><p class="small muted" style="margin-top:10px">Jika pemutar tidak muncul, <a href="${esc(url)}" target="_blank" rel="noopener noreferrer" style="color:var(--accent)">buka playlist di Spotify ↗</a></p>`:`<div class="empty"><div style="font-size:40px;color:#1db954">♫</div><strong>Playlist belum ditautkan</strong>Admin dapat menambahkan tautan playlist Spotify kelas di bawah.</div>`}</section>${can?`<section class="card" style="max-width:900px;margin:16px auto 0"><div class="cardhead"><div><h2 class="h3">Tautkan playlist</h2><p>Salin URL playlist dari Spotify lalu simpan di sini.</p></div></div><form id="playlistForm"><div class="field"><label>URL Spotify</label><input name="url" type="url" value="${esc(url)}" placeholder="https://open.spotify.com/playlist/..." required></div><div class="formactions"><button class="btn">Simpan playlist</button></div></form></section>`:''}`}
function suggestionsView(){const can=isAdmin();return `<div class="sectionhead"><div><div class="eyebrow">Dengar semua suara</div><h2 class="h2">Kotak Saran Anonim</h2><p class="p">Kritik, saran, dan ide untuk membuat kelas semakin kompak.</p></div>${can?'<span class="pill purple">Panel admin</span>':'<span class="pill">Anonim</span>'}</div><div class="grid two"><section class="card"><div class="cardhead"><div><h2 class="h3">Kirim saran rahasia</h2><p>Nama tidak diminta pada formulir ini.</p></div><div class="iconbox">✉</div></div><form id="suggestionForm"><div class="field"><label>Topik saran</label><select name="category"><option>Ide kegiatan</option><option>Kas kelas</option><option>Jadwal & pembelajaran</option><option>Kebersihan kelas</option><option>Masukan untuk pengurus</option><option>Lainnya</option></select></div><div class="field" style="margin-top:13px"><label>Pesan</label><textarea name="body" required maxlength="1200" placeholder="Tulis saran dengan sopan dan jelas..."></textarea></div><div class="formactions"><button class="btn">Kirim secara anonim</button></div><p class="footnote">Catatan: anonimitas di sini berarti formulir tidak meminta nama. Pada versi backend, sistem perlu dirancang agar identitas tidak tercatat pada pesan saran.</p></form></section><section class="card"><div class="cardhead"><div><h2 class="h3">Panduan kotak saran</h2><p>Agar semua orang nyaman memberikan masukan.</p></div></div><div class="notice-row" style="margin-bottom:15px"><div class="miniicon">✓</div><div><strong style="font-size:12px">Sampaikan ide dengan jelas</strong><p class="small muted">Jelaskan situasi dan usulan yang bisa dilakukan.</p></div></div><div class="notice-row" style="margin-bottom:15px"><div class="miniicon">♡</div><div><strong style="font-size:12px">Saling menghormati</strong><p class="small muted">Hindari hinaan, fitnah, atau membagikan data pribadi.</p></div></div><div class="notice-row"><div class="miniicon">◈</div><div><strong style="font-size:12px">Dibaca pengurus</strong><p class="small muted">Pengurus dapat meninjau saran tanpa kolom nama.</p></div></div></section></div>${can?`<section class="card" style="margin-top:16px"><div class="cardhead"><div><h2 class="h3">Saran masuk</h2><p>Panel admin. Jangan mencoba menebak identitas pengirim.</p></div><span class="pill">${data.suggestions.length} saran</span></div>${data.suggestions.length?data.suggestions.slice().reverse().map(s=>`<div class="announcement"><div class="iconbox">✉</div><div class="anncontent"><h3>${esc(s.category)}</h3><p>${esc(s.body)}</p><div class="annmeta">Diterima ${fmtDateTime(s.createdAt)}</div></div><button class="btn danger smallbtn" data-action="deletesuggestion" data-id="${s.id}">Hapus</button></div>`).join(''):'<div class="empty">Belum ada saran masuk.</div>'}</section>`:''}`}
function loginSubmit(e){e.preventDefault();const err=document.getElementById('loginError');if(loginMode==='student'){const id=document.getElementById('loginName').value,pin=document.getElementById('loginPin').value;const s=data.students.find(x=>x.id===id);if(s&&s.pin===pin){currentUser={role:'student',studentId:s.id,name:s.name};currentView='dashboard';shell();}else err.textContent='Nama atau PIN salah. Periksa kembali data login.';}else{const username=document.getElementById('loginUser').value.trim().toLowerCase(),pin=document.getElementById('loginPin').value;const u=DEMO_ADMINS.find(a=>a.username===username&&a.pin===pin&&a.role===loginMode);if(u){currentUser={role:u.role,username:u.username,name:u.name};currentView='dashboard';shell();}else err.textContent='Username atau kode akses salah.';}}
function go(view){currentView=view;document.getElementById('sidebar')?.classList.remove('open');shell();window.scrollTo({top:0,behavior:'smooth'});}
function deleteBy(key,id){data[key]=data[key].filter(x=>x.id!==id);save();logActivity('Data dihapus','Item '+id+' dihapus dari '+key);save();shell();toast('Data berhasil dihapus.');}
function handleAction(el){const a=el.dataset.action;const id=el.dataset.id;if(a==='nav')go(el.dataset.view);else if(a==='loginmode'){loginMode=el.dataset.mode;renderLogin()}else if(a==='logout'){currentUser=null;renderLogin()}else if(a==='menu'){document.getElementById('sidebar').classList.toggle('open')}else if(a==='week'){selectedWeek=Number(el.dataset.week);go('cash')}else if(a==='dayfilter'){document.getElementById('scheduleTable').innerHTML=scheduleTable(el.dataset.day,isAdmin());document.querySelectorAll('[data-action="dayfilter"]').forEach(b=>b.classList.toggle('active',b.dataset.day===el.dataset.day))}else if(a==='togglepayment'){if(!canCash())return;let s=data.students.find(x=>x.id===el.dataset.student),w=Number(el.dataset.week);if(!s)return;while(s.payments.length<w)s.payments.push({week:s.payments.length+1,amount:0,paid:false,paidAt:''});let p=s.payments[w-1];if(p.paid){p.paid=false;p.amount=0;p.paidAt=''}else{p.paid=true;p.amount=data.settings.weeklyDue;p.paidAt=nowISO()}logActivity('Pembayaran kas diperbarui',`${s.name}, minggu ${w}: ${p.paid?'lunas':'belum lunas'}`);save();shell();toast('Status pembayaran diperbarui.')}else if(a==='addweek'&&canCash()){const maxWeek=Math.max(0,...data.students.flatMap(s=>(s.payments||[]).map(p=>Number(p.week)||0)));const next=maxWeek+1;data.students.forEach(s=>{if(!(s.payments||[]).some(p=>Number(p.week)===next))s.payments.push({week:next,amount:0,paid:false,paidAt:''});s.payments.sort((x,y)=>x.week-y.week)});selectedWeek=next;logActivity('Periode kas ditambahkan',`Minggu ${next} ditambahkan untuk seluruh anggota.`);save();shell();toast(`Minggu ${next} berhasil ditambahkan.`)}else if(a==='cancelweek'&&canCash()){const w=Number(el.dataset.week);if(confirm(`Batalkan semua pembayaran di Minggu ${w}? Semua status lunas pada minggu ini akan menjadi belum bayar.`)){let count=0;data.students.forEach(s=>(s.payments||[]).forEach(p=>{if(Number(p.week)===w&&p.paid){p.paid=false;p.amount=0;p.paidAt='';count++}}));logActivity('Pembatalan pembayaran massal',`${count} pembayaran dibatalkan pada Minggu ${w}.`);save();shell();toast(`Pembayaran Minggu ${w} dibatalkan: ${count} catatan.`)}}else if(a==='cancelallpayments'&&canCash()){if(confirm('PERINGATAN: Batalkan SELURUH pembayaran pada SEMUA minggu untuk semua siswa? Tindakan ini akan mengubah semua status lunas menjadi belum bayar.')){let count=0;data.students.forEach(s=>(s.payments||[]).forEach(p=>{if(p.paid){p.paid=false;p.amount=0;p.paidAt='';count++}}));logActivity('Semua pembayaran dibatalkan',`${count} catatan pembayaran dibatalkan di seluruh periode.`);save();shell();toast(`Semua pembayaran dibatalkan: ${count} catatan.`)}}else if(a==='deleteexpense'&&canCash()){if(confirm('Hapus transaksi pengeluaran ini?')){deleteBy('expenses',id)}}else if(a==='deleteschedule'&&isAdmin()){if(confirm('Hapus jadwal ini?'))deleteBy('schedule',id)}else if(a==='deletechore'&&isAdmin()){if(confirm('Hapus kelompok piket ini?'))deleteBy('chores',id)}else if(a==='deleteevent'&&isAdmin()){if(confirm('Hapus agenda ini?'))deleteBy('events',id)}else if(a==='toggleann'&&isAdmin()){const x=data.announcements.find(x=>x.id===id);if(x){x.done=!x.done;save();shell()}}else if(a==='pinann'&&isAdmin()){const x=data.announcements.find(x=>x.id===id);if(x){x.pinned=!x.pinned;save();shell()}}else if(a==='deletegallery'&&isAdmin()){if(confirm('Hapus dokumentasi ini?'))deleteBy('gallery',id)}else if(a==='deletecreative'&&isAdmin()){if(confirm('Hapus karya ini?'))deleteBy('creations',id)}else if(a==='togglepoll'&&isAdmin()){const p=data.polls.find(x=>x.id===id);if(p){p.open=!p.open;save();shell()}}else if(a==='deletepoll'&&isAdmin()){if(confirm('Hapus polling ini?'))deleteBy('polls',id)}else if(a==='deletesuggestion'&&isAdmin()){if(confirm('Hapus saran ini?'))deleteBy('suggestions',id)}else if(a==='exportcash'){exportCash()}else if(a==='resetdemo'&&isAdmin()){if(confirm('Reset semua data ke data contoh awal? Semua perubahan lokal akan hilang.')){data=seedData();save();shell();toast('Data contoh dipulihkan.')}}}
function formSubmit(e){const f=e.target;if(!(f instanceof HTMLFormElement))return;const id=f.id,fd=new FormData(f);const v=k=>(fd.get(k)||'').toString().trim();if(id==='loginForm'){loginSubmit(e);return;}if(f.dataset.form==='vote'){e.preventDefault();const p=data.polls.find(x=>x.id===f.dataset.id);if(!p||!p.open)return;const who=currentUser.role==='student'?currentUser.studentId:currentUser.username;if(p.voters.includes(who)){toast('Akun ini sudah memberikan suara.');return;}const choice=Number(fd.get('choice'));if(!Number.isInteger(choice)||!p.options[choice])return;p.options[choice].votes++;p.voters.push(who);save();logActivity('Voting masuk','Satu suara masuk ke polling: '+p.title);save();shell();toast('Suaramu sudah tercatat.');return;}
 e.preventDefault();
 if(id==='themeForm'&&isAdmin()){const c=v('themeColor');if(/^#[0-9a-f]{6}$/i.test(c))data.settings.accent=c;save();logActivity('Tema portal diubah','Admin memperbarui warna aksen.');save();shell();toast('Warna portal diperbarui.');}
 else if(id==='expenseForm'&&canCash()){const amount=Number(v('amount'));if(amount<=0)return toast('Nominal harus lebih dari nol.');data.expenses.push({id:uid('e'),title:v('title'),amount,date:v('date'),note:v('note')});logActivity('Pengeluaran dicatat',`${v('title')} · ${money(amount)}`);save();shell();toast('Pengeluaran dicatat.');}
 else if(id==='scheduleForm'&&isAdmin()){data.schedule.push({id:uid('j'),day:v('day'),time:v('time'),subject:v('subject'),teacher:v('teacher'),period:Number(v('period'))||1});logActivity('Jadwal diperbarui',v('subject')+' ditambahkan pada hari '+v('day'));save();shell();toast('Jadwal ditambahkan.');}
 else if(id==='choreForm'&&isAdmin()){data.chores.push({id:uid('c'),group:v('group'),day:v('day'),members:v('members')});save();shell();toast('Kelompok piket ditambahkan.');}
 else if(id==='eventForm'&&isAdmin()){data.events.push({id:uid('ev'),title:v('title'),date:v('date'),type:v('type'),note:v('note')});logActivity('Agenda ditambahkan',v('title')+' · '+fmtDate(v('date')));save();shell();toast('Agenda disimpan.');}
 else if(id==='announcementForm'&&isAdmin()){data.announcements.push({id:uid('a'),title:v('title'),body:v('body'),createdAt:nowISO(),author:v('author')||currentUser.name,pinned:fd.has('pinned'),done:false});logActivity('Pengumuman diterbitkan',v('title'));save();shell();toast('Pengumuman berhasil diterbitkan.');}
 else if(id==='addMemberForm'&&isAdmin()){const name=v('name'),pin=v('pin');if(!name)return toast('Nama lengkap wajib diisi.');if(!/^\d{4,8}$/.test(pin))return toast('PIN harus terdiri dari 4–8 angka.');if(data.students.some(s=>s.name.trim().toLowerCase()===name.toLowerCase()))return toast('Nama anggota sudah terdaftar.');const nextWeek=Math.max(1,...data.students.map(s=>(s.payments||[]).length));const student={id:uid('s'),name,nickname:v('nickname'),pin,birthdate:v('birthdate'),social:v('social'),photo:v('photo'),quote:v('quote')||'Tetap kompak, tetap berkarya.',payments:Array.from({length:nextWeek},(_,i)=>({week:i+1,amount:0,paid:false,paidAt:''}))};data.students.push(student);logActivity('Anggota baru ditambahkan',name+' ditambahkan ke direktori kelas.');save();shell();toast('Anggota baru berhasil ditambahkan.');}
 else if(id==='memberForm'&&isAdmin()){const s=data.students.find(s=>s.id===v('id'));if(!s)return;if(v('name'))s.name=v('name');s.nickname=v('nickname');s.birthdate=v('birthdate');s.social=v('social');s.photo=v('photo');s.quote=v('quote');logActivity('Profil anggota diperbarui',s.name);save();shell();toast('Profil anggota diperbarui.');}
 else if(id==='galleryForm'&&isAdmin()){data.gallery.push({id:uid('g'),title:v('title'),type:v('type'),url:v('url'),caption:v('caption'),date:new Date().toISOString().slice(0,10)});save();shell();toast('Dokumentasi ditambahkan.');}
 else if(id==='creativeForm'&&isAdmin()){data.creations.push({id:uid('cr'),title:v('title'),kind:v('kind'),author:v('author'),body:v('body'),createdAt:nowISO()});logActivity('Karya dipublikasikan',v('title'));save();shell();toast('Karya berhasil diterbitkan.');}
 else if(id==='pollForm'&&isAdmin()){const opts=v('options').split(',').map(x=>x.trim()).filter(Boolean);if(opts.length<2)return toast('Polling perlu sedikitnya dua opsi.');data.polls.unshift({id:uid('p'),title:v('title'),options:opts.slice(0,10).map(name=>({name,votes:0})),open:true,voters:[]});save();shell();toast('Polling baru dibuat.');}
 else if(id==='countdownForm'&&isAdmin()){data.countdown={title:v('title'),date:v('date'),note:v('note')};save();shell();toast('Countdown diperbarui.');}
 else if(id==='playlistForm'&&isAdmin()){if(!/https:\/\/(open\.)?spotify\.com\//i.test(v('url')))return toast('Masukkan tautan resmi Spotify.');data.spotifyUrl=v('url');save();shell();toast('Playlist disimpan.');}
 else if(id==='suggestionForm'){data.suggestions.push({id:uid('sug'),category:v('category'),body:v('body'),createdAt:nowISO()});logActivity('Saran anonim masuk','Saran baru diterima dari kotak saran.');save();shell();toast('Saran anonim terkirim. Terima kasih.');}
}
function exportCash(){const rows=[['Nama Lengkap','Minggu Dibayar','Total Perolehan','Alokasi Pengeluaran','Hasil Bersih Simulasi','Belum Dibayar']];data.students.forEach(s=>{const p=studentTotals(s);rows.push([s.name,p.entries,p.paid,p.share.toFixed(2),p.net.toFixed(2),p.outstanding.toFixed(2)])});const csv=rows.map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n');const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='REPUBLIC-OF-X-DKV-rekap-kas.csv';a.click();URL.revokeObjectURL(url);}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(el)handleAction(el)});
document.addEventListener('submit',formSubmit);
document.addEventListener('change',e=>{if(e.target.name==='id'&&e.target.form?.id==='memberForm'){const s=data.students.find(s=>s.id===e.target.value);if(!s)return;const f=e.target.form;f.elements.name.value=s.name;f.elements.nickname.value=s.nickname||'';f.elements.birthdate.value=s.birthdate||'';f.elements.social.value=s.social||'';f.elements.photo.value=s.photo||'';f.elements.quote.value=s.quote||'';}});
function boot(){if(currentUser)shell();else renderLogin();}
boot();
</script>
